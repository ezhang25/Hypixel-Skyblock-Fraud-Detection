<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Skyblock Fraud Monitor</title>
    <link rel="stylesheet" href="/static/styles.css">
  </head>
  <body>
    <header class="appbar">
      <div class="brand"><strong>Skyblock Fraud Monitor</strong><span><i></i>Live detector</span></div>
      <button id="refresh" class="secondary">Refresh</button>
    </header>
    <main>
      <header class="page-header">
        <p class="breadcrumb">Operations / Auction review</p>
        <h1>Flag review queue</h1>
        <p class="subhead">Review model alerts and label confirmed IRL trades for future training.</p>
      </header>
      <section class="stats" aria-label="Detector statistics">
        <article><span>All-time ingested</span><strong id="all-time">—</strong></article>
        <article><span>Currently retained</span><strong id="retained">—</strong></article>
        <article><span>Awaiting review</span><strong id="unreviewed">—</strong></article>
        <article><span>Confirmed IRL</span><strong id="confirmed">—</strong></article>
      </section>
      <section class="review-panel">
        <div class="section-title">
          <div><h2>Open alerts</h2><p id="status" class="status" aria-live="polite"></p></div>
          <label class="filter">Risk tier
            <select id="tier-filter">
              <option value="">All tiers</option><option value="HIGH">High</option>
              <option value="MEDIUM">Medium</option><option value="LOW">Low</option>
            </select>
          </label>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Risk</th><th>Auction</th><th>Price</th><th>Participants</th><th>Signals</th><th>Review</th></tr></thead>
            <tbody id="flags"></tbody>
          </table>
        </div>
      </section>
    </main>
    <template id="flag-template">
      <tr class="flag-row">
        <td><span class="tier"></span><span class="score"></span></td>
        <td><strong class="item-name"></strong><span class="format"></span></td>
        <td class="price"></td>
        <td><span class="seller"></span><span class="buyer"></span></td>
        <td><ul class="reasons"></ul></td>
        <td><input class="notes" maxlength="1000" placeholder="Optional note" aria-label="Optional review note"><div class="actions"><button class="confirm">Confirm IRL</button><button class="false-positive secondary">False positive</button></div></td>
      </tr>
    </template>
    <script src="/static/app.js"></script>
  </body>
</html>
